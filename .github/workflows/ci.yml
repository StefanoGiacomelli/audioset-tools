name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ruff + pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (editable, with the download and plot extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,download,plot]"
      - name: Lint
        run: ruff check .
      - name: "Tests (offline - excerpts in tests/data, fake yt-dlp, synthetic SALT files)"
        run: pytest

  package:
    name: build and test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the wheel into a clean environment and run the tests against it
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/python -m pip install --upgrade pip
          /tmp/wheel-env/bin/python -m pip install "$(ls dist/*.whl)[dev,download,plot]"
          cd /tmp && /tmp/wheel-env/bin/python -c "import audioset_tools, sys; print(audioset_tools.__version__, audioset_tools.__file__)"
          cd "$GITHUB_WORKSPACE" && /tmp/wheel-env/bin/python -m pytest tests
